spring.application.name=LoveMining

# Connection settings are read from environment variables.
# The defaults below target a local single-node setup.

# MongoDB (replica set in the original deployment, e.g. mongodb://host1:27017,host2:27017,host3:27017/?replicaSet=lsmdb)
app.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}

# Neo4j
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:password}
